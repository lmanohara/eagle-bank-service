
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:eaglebank
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: my-secret-key-my-secret-key-my-secret-key
  expiration: 3600000
